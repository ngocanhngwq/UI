<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="../css/common.css" rel="stylesheet" />
    <link href="../css/layout/header.css" rel="stylesheet" />
    <link href="../css/layout/content.css" rel="stylesheet" />

    <link href="../css/page/customer.css" rel="stylesheet" />
    <link href="../css/page/setting.css" rel="stylesheet" />
</head>
<body>
    <!-- Navbar -->
    <div id="navbar">
        <div class="logo-box">
            <div class="sidebar"></div>
            <div class="logo"></div>
        </div>
        <div class="navbar-box">
            <a class="navbar-item" href="../index.html">
                <div class="navbar-icon icon-dashboard"></div>
                <div class="navbar-text">Tổng quan</div>
            </a>
            <a class="navbar-item" href="../pages/homepage.html">
                <div class="navbar-icon icon-report"></div>
                <div class="navbar-text">Danh sách giáo viên</div>
            </a>
            <a class="navbar-item" href="../pages/customer.html">
                <div class="navbar-icon icon-students"></div>
                <div class="navbar-text">Danh sách học sinh</div>
            </a>
            <a class="navbar-item" href="../pages/rules.html">
                <div class="navbar-icon icon-rules"></div>
                <div class="navbar-text">Nội quy</div>
            </a>
            <a class="navbar-item" href="../pages/timetable.html">
                <div class="navbar-icon icon-sche"></div>
                <div class="navbar-text">Thời khóa biểu</div>
            </a>
            <a class="navbar-item" href="../pages/advice.html">
                <div class="navbar-icon icon-advice"></div>

            </a>
            <a class="navbar-item" href="../pages/point.html">

            </a>
            <a class="navbar-item" href="../pages/Charts.html">
                <div class="navbar-icon icon-aw"></div>
                <div class="navbar-text">Bảng xếp hạng</div>
            </a>
            <a class="navbar-item" href="../pages/setting.html">
                <div class="navbar-icon icon-setting"></div>
                <div class="navbar-text">Cài đặt</div>
            </a>
        </div>
    </div>
    <!-- Header -->
    <div id="header">
        <select class="class">
            <option>Class 7A</option>
            <option>Class 7B</option>
            <option>Class 7C</option>
            <option>Class 7D</option>
            <option>Class 7E</option>
            <option>Class 7G</option>
            <option>Class 7H</option>
            <option>Class 7T</option>
            <option>Class 7K</option>
        </select>
        <marquee direction="left" style="color:#2fbe8e; font-size:24px; margin-bottom: 24px;">Class 7A - We are family!</marquee>
    </div>
    <div id="content">
        <div class="page-title">
            <div class="page-left">Phản hồi</div>
            <div class="page-right"></div>
        </div>
        <div class="grid" style="position: absolute; right: 0px; left: 25px; bottom: 0px; top: 81px; overflow-y: auto;">
            <form id="feedbackForm">
                <input type="text" id="txtFeedback" name="txtTen" style="position: absolute;" maxlength="1500"
                       placeholder="Mọi ý kiến phản hồi xin hãy góp ý ở đây" required /><br />
                <input class="submit" type="submit" value="Gửi phản hồi" />
            </form>
        </div>
    </div>

    <script src="../lib/jquery-3.6.0.min.js"></script>
    <script src="../js/page/customer.js"></script>
    <script>
        document.getElementById('feedbackForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Cảm ơn bạn đã gửi phản hồi!');
            this.reset();
        });
    </script>
