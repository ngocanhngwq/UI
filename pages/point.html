    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
        google.charts.load('current', {'packages': ['bar']});
        google.charts.setOnLoadCallback(drawChart);

        function drawChart() {
            var data = google.visualization.arrayToDataTable([
                ['Môn học', '5-7 điểm', '8-9 điểm', '10 điểm'],
                ['Toán (Maths)', 30, 40, 10],
                ['Ngữ văn (Literature)', 20, 38, 10],
                ['Tiếng Anh (English)', 10, 35, 15],
                ['Địa lý (Geography)', 50, 30, 20],
                ['Sinh học (Biology)', 20, 40, 50],
                ['Công nghệ (Technology)', 60, 40, 53],
                ['Vật lý (Physics)', 19, 40, 49]
            ]);

            var options = {
                chart: {
                    title: 'Thống kê điểm số theo môn học',
                    subtitle: 'Tháng 1/2021 - Tháng 5/2021'
                },
                bars: 'horizontal'
            };

            var chart = new google.charts.Bar(document.getElementById('barchart_material'));
            chart.draw(data, google.charts.Bar.convertOptions(options));
        }
    </script>
